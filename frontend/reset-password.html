<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Book Bank Management System — Reset Password">
    <title>Book Bank — Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Logo -->
            <div class="logo">
                <span class="logo-icon">📚</span>
                <h1>Book Bank</h1>
                <p>Reset Your Password</p>
            </div>

            <!-- Alert Area -->
            <div id="resetAlert" class="alert"></div>

            <!-- Reset Password Form -->
            <form id="resetForm" class="auth-form active" onsubmit="handleResetPassword(event)">
                <div class="form-group">
                    <label for="resetUserId">Register Number (Student ID)</label>
                    <input type="text" id="resetUserId" placeholder="Enter your Register Number" required>
                </div>
                <div class="form-group">
                    <label for="resetNewPassword">New Password</label>
                    <input type="password" id="resetNewPassword" placeholder="Min 6 characters" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="resetConfirmPassword">Confirm Password</label>
                    <input type="password" id="resetConfirmPassword" placeholder="Confirm your new password"
                        minlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary" id="resetBtn">
                    Reset Password
                </button>
                <div style="text-align: center; margin-top: 15px;">
                    <a href="index.html"
                        style="font-size: 0.9rem; color: var(--text-muted); text-decoration: none;">&larr; Back to
                        Login</a>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
